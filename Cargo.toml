[package]
name = "storm-edge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "3d_bevy_render", "bevy_ui", "bevy_ui_render", "bevy_text", "bevy_state", "default_font", "png", "x11", "webgpu", "bevy_audio", "wav"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[profile.web]
inherits = "release"
opt-level = "s"
lto = false

[profile.ci]
inherits = "dev"
opt-level = 0

[profile.ci.package."*"]
opt-level = 0
